# ---------------------------
# ~/.tmux.conf
# ---------------------------

# Set prefix to Ctrl+a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ---------------------------
# General settings
# ---------------------------
set -g mouse on
set -g history-limit 10000
set -g allow-rename off
set -g bell-action none
set-option -g status-position top

# ---------------------------
# Plugins (Tmux Plugin Manager required)
# ---------------------------
# Install TPM first: https://github.com/tmux-plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto save/restore
set -g @plugin 'tmux-plugins/tmux-yank'        # copy to system clipboard
set -g @plugin 'egel/tmux-gruvbox'



# Set desired theme option
set -g @tmux-gruvbox 'dark' # or 'dark256', 'light', 'light256'

# Enable continuum auto save
set -g @continuum-restore 'on'
set -g @resurrect-strategy-vim 'session'

# ---------------------------
# Keybindings for tmux-resurrect
# ---------------------------
bind C-s run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh'
bind C-r run-shell '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh'

# ---------------------------
# Initialize TPM (keep at bottom)
# ---------------------------
run '~/.tmux/plugins/tpm/tpm'
